"go:github.com/bufbuild/buf/cmd/buf" = "1.75.0"
"go:github.com/fullstorydev/grpcurl/cmd/grpcurl" = "1.9.4"
"go:github.com/awslabs/diagram-as-code/cmd/awsdac" = "0.22.4"
"go:mvdan.cc/gofumpt" = "0.12.0"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.21.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
node = "26.12.1"
pnpm = "12.14.0"
"npm:@openai/codex" = "0.163.0"
bat = "0.26.1"
bats = "1.14.0"
bottom = "0.15.0"
d2 = "0.9.0"
duf = "0.9.1"
dust = "1.2.7"
eza = "0.23.5"
fd = "10.5.0"
gh = "2.103.3"
jq = "1.8.2"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
terraform = "1.17.1"
zoxide = "0.10.0"
python = ["3.15", "3.14", "3.12"]
uv = "0.13.7"
"pypi:git-filter-repo" = { version = "2.47.0", python = "3.14" }
"pypi:rumdl" = { version = "0.2.79", python = "3.14" }
"pypi:streamlink" = { version = "8.6.3", python = "3.14" }
"pypi:yamllint" = { version = "1.38.0", python = "3.14" }
"pypi:yt-dlp" = { version = "2026.10.26", python = "3.14" }

[env]
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_SEARCH_PATH = "{{env.HOME}}/.local/share/mise/shims"
