[settings]
minimum_release_age = "7d"

[tools]
"aqua:awslabs/git-secrets" = { version = "1.3.0", os = ["linux", "macos"] }
dprint = "0.60.1"
markdownlint-cli2 = "0.23.3"
node = "26.11.1"
pnpm = "12.10.1"
python = "3.15.0"
rumdl = "0.2.78"
shfmt = "3.14.1"
shellcheck = "0.11.0"
taplo = "0.10.0"
uv = "0.13.0"
yamllint = "1.38.0"

[tasks.dot-init]
description = "dotfile mise管理の初期化（タスクに実行権限を付与、依存同期など）"
quiet = true
run = [
  "test -d mise/tasks && chmod +x mise/tasks/*.sh",
  "bash mise/tasks/initialize.sh",
]

[tasks.dot-upgrade]
description = "mise tools の依存関係を最新にする"
run = ["mise upgrade", "mise lock"]

[tasks.install-git-secrets]
description = "git-secrets を現在の OS に導入する"
run = "command -v git-secrets >/dev/null || make -C /tmp/git-secrets install"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -Command \"if (-not (Get-Command git-secrets -ErrorAction SilentlyContinue)) { if (-not (Test-Path \\\"$env:TEMP\\git-secrets\\.git\\\")) { git clone https://github.com/awslabs/git-secrets.git \\\"$env:TEMP\\git-secrets\\\" }; Push-Location \\\"$env:TEMP\\git-secrets\\\"; try { & .\\install.ps1 } finally { Pop-Location } }\""
