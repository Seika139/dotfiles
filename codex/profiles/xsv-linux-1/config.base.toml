model_reasoning_effort = "high"
hide_agent_reasoning = true

notify = [
  "bash",
  "-lc",
  "CODEX_NOTIFY_CHANNEL=discord CODEX_NOTIFY_DEBUG_LOG=\"$HOME/dotfiles/codex/profiles/xsv-linux-1/notify.log\" exec \"$HOME/dotfiles/codex/notify.sh\" \"$@\"",
  "codex-notify",
]

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "project-name",
  "git-branch",
  "pull-request-number",
  "branch-changes",
  "run-state",
  "permissions",
  "approval-mode",
  "context-used",
  "context-window-size",
  "used-tokens",
  "task-progress",
  "five-hour-limit",
  "weekly-limit",
]
status_line_use_colors = true

[features]
fast_mode = false

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 3
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[sandbox_workspace_write]
network_access = true
